# V5B — V5 adapter decoded with beam search (5 beams); same guards and V3 DEV. Evaluation only (run after V5 trains).
model:
  name: local/models/PhoWhisper-medium-fp16   # vinai/PhoWhisper-medium converted to fp16 safetensors (the 3 GB fp32 .bin segfaults at load with ~3 GB free RAM)
  dtype: float16
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, out_proj, fc1, fc2]

data:
  eval_sources: [VIVOS, FLEURS, VietMed, ViMedCSS_vsplit]

eval:
  checkpoint: local/runs/V5_phowhisper_medium_lora_vsplit_specaug/local_v5/final   # relative to ASR/
  num_beams: 5
  silence_peak: 1.0e-3
  max_tokens_per_second: 12
  max_tokens_offset: 20
