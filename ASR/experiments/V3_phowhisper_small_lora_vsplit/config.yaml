# V3 — PhoWhisper-small + LoRA trained from the base model on V3 data (scripts/build_v3_data.py):
#   - ViMedCSS re-split by source video (data/ViMedCSS_vsplit, 0 shared videos): the official splits share videos
#     (81.7% of TRAIN clips), so V1/V2 ViMedCSS scores are optimistic. Compare V3 with B0V, not with V1/V2 on ViMedCSS.
#   - TRAIN exclusions (data/v3_train_exclude.json): silent clips and labels denser than 16 tokens/s.
#   - lr 3e-4: V1 at 1e-3 diverged (steps 660-900) and only improved once the decay brought lr below ~3e-4.
# evaluate.py decodes with the TRAIN-derived guards of V1G; in-training DEV-subset eval does not.
model:
  name: vinai/PhoWhisper-small
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, out_proj, fc1, fc2]

data:
  train_sources:
    _replace: true           # do not inherit _base's official ViMedCSS (it contains the new DEV/TEST videos)
    VIVOS: null
    FLEURS: null
    VietMed: null
    ViMedCSS_vsplit: null
  eval_sources: [VIVOS, FLEURS, VietMed, ViMedCSS_vsplit]
  train_exclude: v3_train_exclude.json

train:
  epochs: 3
  batch_size: 16
  grad_accum: 2              # effective batch 32
  lr: 3.0e-4
  warmup_ratio: 0.05
  fp16: true
  gradient_checkpointing: true
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  logging_steps: 50
  num_workers: 2
  eval_batch_size: 8

eval:
  silence_peak: 1.0e-3
  max_tokens_per_second: 12
  max_tokens_offset: 20
