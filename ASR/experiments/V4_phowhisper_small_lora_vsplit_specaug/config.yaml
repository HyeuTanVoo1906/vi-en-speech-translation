# V4 — V3 + SpecAugment, everything else identical (data, lr 3e-4, 3 epochs, LoRA, seed), so V4 vs V3 isolates it.
# V3's DEV-subset WER bottomed out at step 1800 (0.1199) and stayed flat to 2802: more epochs alone stopped helping.
# Whisper's built-in SpecAugment masks the log-mel input during training only (evaluation is unchanged):
#   time: ~5% of frames in 100 ms spans (>= 2 spans per clip); frequency: one 10-bin band in ~40% of clips.
# Compare with V3 and B0V on the V3 DEV (ViMedCSS re-split by video); in-training eval_wer curves are comparable with V3.
model:
  name: vinai/PhoWhisper-small
  lora:
    r: 32
    alpha: 64
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, out_proj, fc1, fc2]
  spec_augment:
    mask_time_prob: 0.05
    mask_time_length: 10
    mask_feature_prob: 0.05
    mask_feature_length: 10

data:
  train_sources:
    _replace: true           # do not inherit _base's official ViMedCSS (it contains the new DEV/TEST videos)
    VIVOS: null
    FLEURS: null
    VietMed: null
    ViMedCSS_vsplit: null
  eval_sources: [VIVOS, FLEURS, VietMed, ViMedCSS_vsplit]
  train_exclude: v3_train_exclude.json

train:
  epochs: 3
  batch_size: 16
  grad_accum: 2              # effective batch 32
  lr: 3.0e-4
  warmup_ratio: 0.05
  fp16: true
  gradient_checkpointing: true
  eval_steps: 500
  save_steps: 500
  save_total_limit: 2
  logging_steps: 50
  num_workers: 2
  eval_batch_size: 8

eval:
  silence_peak: 1.0e-3
  max_tokens_per_second: 12
  max_tokens_offset: 20
